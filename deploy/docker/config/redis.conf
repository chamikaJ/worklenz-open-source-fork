# ============================================
# Redis Configuration for Worklenz
# ============================================

# Bind to all interfaces (Docker internal network)
bind 0.0.0.0

# Port
port 6379

# Protected mode (use password instead)
protected-mode yes

# Persistence - Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Persistence - RDB Snapshots
save 900 1      # Save after 900 sec (15 min) if at least 1 key changed
save 300 10     # Save after 300 sec (5 min) if at least 10 keys changed
save 60 10000   # Save after 60 sec if at least 10000 keys changed

# Max memory policy
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Performance tuning
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Replication (for future HA setup)
# replica-read-only yes
# min-replicas-to-write 1
# min-replicas-max-lag 10
